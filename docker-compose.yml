version: '3.8'
services:
  postgres_db:
    image: postgres:17-alpine
    container_name: postgres_inductie_17
    environment:
      POSTGRES_DB: inductie_db
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: SecurePassword123
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data: